name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Check contract lockfile
        run: cargo check --locked --manifest-path contracts/escrow/Cargo.toml

      - name: Run contract unit tests
        run: cargo test --manifest-path contracts/escrow/Cargo.toml

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix backend

      - name: Run typecheck
        run: npm run typecheck --prefix backend

      - name: Run smoke tests
        run: npm test --prefix backend

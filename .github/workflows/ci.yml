name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Check contract lockfile
        run: cargo check --locked --workspace

      - name: Run contract unit tests
        run: cargo test --workspace

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix backend

      - name: Run linter
        run: npm run lint --prefix backend

      - name: Check code formatting
        run: npm run format:check --prefix backend

      - name: Run typecheck
        run: npm run typecheck --prefix backend

      - name: Build production bundle
        run: npm run build --prefix backend

      - name: Run unit and integration tests with coverage
        run: npm test --prefix backend

      - name: Run OpenAPI sync test harness
        run: node --test scripts/test-check-openapi-sync.mjs

      - name: Verify OpenAPI spec route synchronization
        run: node scripts/check-openapi-sync.mjs

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run dependency audit test harness
        run: node --test scripts/test-audit-deps.mjs

      - name: Run dependency audit gate
        run: node scripts/audit-deps.mjs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Check code formatting
        run: npm run lint --prefix frontend

      - name: Run unit tests
        run: npm test --prefix frontend

      - name: Build production bundle
        run: npm run build --prefix frontend




name: Feature Request
description: Suggest an idea or enhancement for this project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement or new feature for the project!
  - type: dropdown
    id: layer
    attributes:
      label: Target Layer
      description: Which layer or component will this feature affect?
      options:
        - Contract (Rust/Soroban)
        - Backend (Node/Express)
        - Both / Cross-cutting
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem, limitation, or use case? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of the solution or behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, references, or design details.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request implementing this feature.

name: Bug Report
description: File a bug report or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us triage and fix it quickly.
  - type: dropdown
    id: layer
    attributes:
      label: Which layer?
      description: Which layer is affected by this issue?
      options:
        - Contract (Rust/Soroban)
        - Backend (Node/Express)
        - Both/Unclear
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Start backend with `npm run dev`
        2. Call endpoint or invoke contract method with `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Actual Behavior / Logs
      description: Relevant logs, stack traces, transaction hashes, or terminal output.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: Environment details if applicable.
      placeholder: |
        - OS: [e.g. Linux, macOS, Windows]
        - Rust / Soroban CLI: [e.g. 21.0.0]
        - Node.js: [e.g. 22.x]
        - Network: [e.g. Stellar Testnet, Local Sandbox]
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: If this concerns a security vulnerability with funds at risk, I have followed SECURITY.md instead of filing a public issue.
          required: true
